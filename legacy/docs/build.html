<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Build a Tree</title>
<meta name="description" content="Deal vertebrate species, group them into a phylogeny, score the result.">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/build.css">
</head>
<body>

<div class="app app-build">

  <header class="topbar">
    <h1>Build a Tree</h1>
    <p class="stats" id="progress"></p>
    <div class="spacer"></div>
    <a class="tool" href="index.html">Explorer &rarr;</a>
  </header>

  <main class="build-main">

    <section class="setup panel">
      <div class="setup-row">
        <label class="field inline">
          <span class="field-label">Species</span>
          <input type="range" id="count" min="3" max="20" value="8" step="1">
          <output id="countOut">8</output>
        </label>

        <label class="field inline">
          <span class="field-label">Drawn from</span>
          <select id="scope"></select>
        </label>

        <label class="field inline">
          <span class="field-label">Difficulty</span>
          <select id="difficulty">
            <option value="spread">Spread out</option>
            <option value="close">Close relatives</option>
          </select>
        </label>

        <label class="check"><input type="checkbox" id="fossils">
          <span>Include fossils</span></label>

        <button class="tool primary" id="deal">Deal</button>
      </div>
    </section>

    <section class="instructions panel" id="hintbar">
      <p><strong>Join two cards to make a clade.</strong> Click one then the
        other, or drag one onto the other. Keep going until one tree is left.
        <em>ungroup</em> undoes a join.</p>
    </section>

    <div class="bench" id="bench" aria-label="Taxa to group"></div>

    <div class="build-actions">
      <button class="tool primary" id="check" disabled>Check</button>
      <button class="tool" id="reset">Start over</button>
      <button class="tool" id="reveal">Show answer</button>
    </div>

    <section class="results panel" id="results" hidden></section>

  </main>

  <div id="loading" class="loading">Loading the tree&hellip;</div>
</div>

<script type="module" src="js/build.js"></script>
<noscript>
  <p style="padding:2rem;font:16px system-ui">This exercise needs JavaScript.</p>
</noscript>
</body>
</html>
